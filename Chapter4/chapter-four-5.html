    <script>
      // Generate 100 HTML & CSS Unique Quiz Questions
      const quizDatabase = [];

      // HTML Questions (1-50)
      const htmlQuestions = [
        {
          q: "HTML এর পূর্ণরূপ কী?",
          o: [
            "Hyper Text Markup Language",
            "High Text Markup Language",
            "Hyper Tabular Markup Language",
            "Hyper Tech Marking Language",
          ],
          c: 0,
          t: "html",
          e: "HTML এর পূর্ণরূপ হলো Hyper Text Markup Language যা ওয়েব পেজ তৈরির মূল স্ট্রাকচার।",
        },
        {
          q: "HTML এর সর্বশেষ স্ট্যান্ডার্ড সংস্করণ কোনটি?",
          o: ["HTML 4.01", "HTML5", "XHTML", "HTML6"],
          c: 1,
          t: "html",
          e: "বর্তমানে ব্যবহৃত সর্বশেষ অফিসিয়াল স্ট্যান্ডার্ড সংস্করণ হচ্ছে HTML5।",
        },
        {
          q: "HTML ডকুমেন্টের রুট (Root) এলিমেন্ট বা ট্যাগ কোনটি?",
          o: ["<body>", "<head>", "<html>", "<doctype>"],
          c: 2,
          t: "html",
          e: "<html> ট্যাগটি হলো একটি HTML ডকুমেন্টের রুট বা মূল কন্টেইনার।",
        },
        {
          q: "HTML5 এ সঠিক DOCTYPE ডিক্লারেশন কোনটি?",
          o: [
            "<!DOCTYPE html>",
            "<doctype html5>",
            "<html doctype>",
            "<!DOCTYPE HTML PUBLIC>",
          ],
          c: 0,
          t: "html",
          e: "HTML5 এর জন্য স্ট্যান্ডার্ড ও সহজ ডিক্লারেশন হলো <!DOCTYPE html>।",
        },
        {
          q: "সবচেয়ে বড় সাইজের হেডিং তৈরি করার জন্য কোন ট্যাগটি ব্যবহৃত হয়?",
          o: ["<h6>", "<heading>", "<h1>", "<head>"],
          c: 2,
          t: "html",
          e: "<h1> ট্যাগ সবচেয়ে বড় এবং <h6> ট্যাগ সবচেয়ে ছোট হেডিং তৈরি করে।",
        },
        {
          q: "HTML পেজে একটি লাইন ব্রেক (Line Break) তৈরি করার সঠিক ট্যাগ কোনটি?",
          o: ["<lb>", "<br>", "<break>", "<newline>"],
          c: 1,
          t: "html",
          e: "<br> হলো একটি এম্পটি (Empty) ট্যাগ যা নতুন লাইনে যাওয়ার জন্য ব্যবহৃত হয়।",
        },
        {
          q: "কোনটি একটি এম্পটি বা ভয়েড (Void) এলিমেন্ট যার কোনো ক্লোজিং ট্যাগ নেই?",
          o: ["<p>", "<img>", "<a>", "<div>"],
          c: 1,
          t: "html",
          e: "<img> ট্যাগের কোনো ক্লোজিং ট্যাগ বা শেষ অংশ থাকে না।",
        },
        {
          q: "ওয়েব পেজে হাইপারলিঙ্ক (Hyperlink) তৈরি করার জন্য কোন ট্যাগ ব্যবহার করা হয়?",
          o: ["<link>", "<a>", "<href>", "<url>"],
          c: 1,
          t: "html",
          e: "Anchor বা <a> ট্যাগ হাইপারলিঙ্ক তৈরির জন্য ব্যবহৃত হয়।",
        },
        {
          q: "<a> ট্যাগের ভেতরে লিঙ্কের গন্তব্য বা URL যুক্ত করার জন্য কোন অ্যাট্রিবিউট ব্যবহার করা হয়?",
          o: ["src", "link", "href", "target"],
          c: 2,
          t: "html",
          e: "href (Hypertext Reference) অ্যাট্রিবিউট লিঙ্কের গন্তব্য নির্দিষ্ট করে।",
        },
        {
          q: "কোনো লিঙ্ককে ব্রাউজারের নতুন ট্যাবে ওপেন করতে হলে target অ্যাট্রিবিউটের মান কী হতে হবে?",
          o: ["_self", "_parent", "_top", "_blank"],
          c: 3,
          t: "html",
          e: "target='_blank' ব্যবহার করলে লিঙ্কটি নতুন ট্যাব বা উইন্ডোতে খোলে।",
        },
        {
          q: "HTML এ ইমেজ বা ছবি যুক্ত করার সঠিক সিনট্যাক্স কোনটি?",
          o: [
            "<img src='image.jpg' alt='myImage'>",
            "<image src='image.jpg'>",
            "<img href='image.jpg'>",
            "<img source='image.jpg'>",
          ],
          c: 0,
          t: "html",
          e: "<img> ট্যাগ এবং src ও alt অ্যাট্রিবিউটের সমন্বয়ে ইমেজ ডিফাইন করা হয়।",
        },
        {
          q: "ইমেজ ট্যাগে alt অ্যাট্রিবিউট ব্যবহারের মূল কারণ কী?",
          o: [
            "ছবির বর্ডার দেওয়া",
            "ছবি লোড না হলে বিকল্প টেক্সট প্রদর্শন করা",
            "ছবির সাইজ বড় করা",
            "ছবির এনিমেশন দেওয়া",
          ],
          c: 1,
          t: "html",
          e: "কোনো কারণে ছবি লোড হতে ব্যর্থ হলে alt (Alternative) টেক্সট স্ক্রিনে প্রদর্শিত হয়।",
        },
        {
          q: "HTML এ একটি বুলেটযুক্ত বা আনঅর্ডারড লিস্ট (Unordered List) তৈরি করার ট্যাগ কোনটি?",
          o: ["<ol>", "<ul>", "<li>", "<list>"],
          c: 1,
          t: "html",
          e: "<ul> ট্যাগ দ্বারা আনঅর্ডারড (বুলেট পয়েন্ট) এবং <ol> দ্বারা অর্ডারড (নাম্বারড) লিস্ট তৈরি করা হয়।",
        },
        {
          q: "লিস্টের প্রতিটি উপাদান বা আইটেম ডিফাইন করার জন্য কোন ট্যাগ ব্যবহার করা হয়?",
          o: ["<list>", "<item>", "<li>", "<ul-item>"],
          c: 2,
          t: "html",
          e: "<li> (List Item) ট্যাগ <ol> অথবা <ul> এর ভেতরে প্রতিটি আইটেম তৈরি করে।",
        },
        {
          q: "HTML এ অর্ডারড লিস্টের সংখ্যা পরিবর্তনের জন্য নিচের কোন অ্যাট্রিবিউটটি ব্যবহৃত হয়?",
          o: ["type", "start", "value", "num"],
          c: 1,
          t: "html",
          e: "start অ্যাট্রিবিউট দিয়ে লিস্ট কোন সংখ্যা থেকে শুরু হবে তা নির্ধারণ করা যায়।",
        },
        {
          q: "HTML টেবিল তৈরিতে টেবিলের একটি রো (Row) বা সারি ডিফাইন করার ট্যাগ কোনটি?",
          o: ["<td>", "<th>", "<tr>", "<table-row>"],
          c: 2,
          t: "html",
          e: "<tr> (Table Row) ট্যাগ টেবিলের সারি তৈরির জন্য ব্যবহৃত হয়।",
        },
        {
          q: "টেবিলের কোনো ডাটা সেলকে হেডার সেল (যা সাধারণত বোল্ড ও সেন্টারে থাকে) হিসেবে দেখানোর ট্যাগ কোনটি?",
          o: ["<th>", "<td>", "<thead>", "<header>"],
          c: 0,
          t: "html",
          e: "<th> (Table Header) সেলকে ডিফল্টভাবে বোল্ড এবং সেন্টারড করে।",
        },
        {
          q: "একাধিক কলামকে একত্রিত (Merge) করার জন্য কোন টেবিল অ্যাট্রিবিউট ব্যবহৃত হয়?",
          o: ["rowspan", "colspan", "cellpadding", "cellspacing"],
          c: 1,
          t: "html",
          e: "colspan (Column Span) কলাম এবং rowspan সারি মার্জ করার জন্য ব্যবহৃত হয়।",
        },
        {
          q: "ব্যবহারকারীর কাছ থেকে ইনপুট বা ডেটা নেওয়ার জন্য কোন ট্যাগটি কন্টেইনার হিসেবে কাজ করে?",
          o: ["<input>", "<form>", "<select>", "<textarea>"],
          c: 1,
          t: "html",
          e: "<form> ট্যাগ ব্যবহারকারীর ডেটা সাবমিট করার জন্য সমস্ত ইনপুট এলিমেন্টকে ধারণ করে।",
        },
        {
          q: "ইনপুট ফিল্ডে পাসওয়ার্ড টাইপ করার সময় অক্ষরগুলো লুকিয়ে রাখার জন্য সঠিক type কোনটি?",
          o: [
            "type='text'",
            "type='hidden'",
            "type='password'",
            "type='secure'",
          ],
          c: 2,
          t: "html",
          e: "type='password' ব্যবহার করলে ইনপুট ক্যারেক্টারগুলো ডট বা স্টারে রূপান্তরিত হয়।",
        },
        {
          q: "একাধিক অপশন থেকে যেকোনো একটি মাত্র অপশন সিলেক্ট করার ইনপুট টাইপ কোনটি?",
          o: ["checkbox", "radio", "select", "button"],

      // Combine arrays into quizDatabase
      quizDatabase.push(...htmlQuestions, ...cssQuestions);

      let userAnswers = {};
      let currentFilter = "all";

      window.onload = function () {
        renderDashboard();
        renderQuestionGrid();
        renderQuestions();
      };

      function renderQuestionGrid() {
        const gridContainer = document.getElementById("question-grid");
        gridContainer.innerHTML = "";
        quizDatabase.forEach((q, idx) => {
          let btnClass = "bg-slate-200 text-slate-700 hover:bg-slate-300";
          if (userAnswers[idx] !== undefined) {
            btnClass =
              userAnswers[idx] === q.c
                ? "bg-emerald-600 text-white font-bold"
                : "bg-rose-600 text-white font-bold";
          }
          const btn = document.createElement("button");
          btn.className = `w-8 h-8 rounded-lg text-xs transition-all flex items-center justify-center cursor-pointer ${btnClass}`;
          btn.innerText = idx + 1;
          btn.onclick = () => {
            const element = document.getElementById(`q-card-${idx}`);
            if (element) {
              element.scrollIntoView({ behavior: "smooth", block: "center" });
              element.classList.add("ring-4", "ring-indigo-400");
              setTimeout(
                () => element.classList.remove("ring-4", "ring-indigo-400"),
                1000,
              );
            }
          };
          gridContainer.appendChild(btn);
        });
      }

      // প্রশ্ন/অপশনের টেক্সটে থাকা <img>, <html>, <li> ইত্যাদি রিয়েল ট্যাগ ভেঙে ব্রাউজার যেন
      // আসল HTML এলিমেন্ট হিসেবে রেন্ডার না করে ফেলে (ফলে টেক্সট অদৃশ্য হয়ে যাচ্ছিল),
      // তাই < ও > কে HTML entity তে কনভার্ট করে প্লেইন টেক্সট হিসেবে দেখানো হচ্ছে।
      function escapeHtml(str) {
        const div = document.createElement("div");
        div.textContent = str;
        return div.innerHTML;
      }

      function renderQuestions() {
        const listContainer = document.getElementById("questions-list");
        listContainer.innerHTML = "";
        quizDatabase.forEach((item, idx) => {
          if (currentFilter !== "all" && item.t !== currentFilter) return;

          const card = document.createElement("div");
          card.id = `q-card-${idx}`;
          card.className =
            "bg-white rounded-2xl shadow-sm border border-slate-200/80 p-5 md:p-6 transition-all duration-300";

          const isAnswered = userAnswers[idx] !== undefined;
          let optionsHTML = "";
          const prefix = ["A", "B", "C", "D"];

          item.o.forEach((opt, optIdx) => {
            let optClass =
              "border-slate-200 hover:border-indigo-200 hover:bg-slate-50/60";
            let icon = "";
            if (isAnswered) {
              if (optIdx === item.c) {
                optClass =
                  "border-emerald-500 bg-emerald-50/60 text-emerald-900 font-semibold";
                icon =
                  '<i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>';
              } else if (optIdx === userAnswers[idx]) {
                optClass =
                  "border-rose-400 bg-rose-50/60 text-rose-900 font-semibold";
                icon =
                  '<i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>';
              } else {
                optClass =
                  "border-slate-100 bg-slate-50/20 text-slate-400 cursor-not-allowed";
              }
            }

            optionsHTML += `
              <button onclick="selectOption(${idx}, ${optIdx})" ${isAnswered ? "disabled" : ""} class="w-full text-left flex items-center justify-between p-3.5 border rounded-xl text-sm md:text-base transition-all group ${optClass} cursor-pointer">
                <span class="flex items-center gap-3">
                  <span class="w-7 h-7 shrink-0 rounded-lg flex items-center justify-center font-bold text-xs ${isAnswered ? "bg-slate-200 text-slate-600" : "bg-slate-100 text-slate-500 group-hover:bg-indigo-100 group-hover:text-indigo-600"}">${prefix[optIdx]}</span>
                  <span>${escapeHtml(opt)}</span>
                </span>
                ${icon}
              </button>
            `;
          });

          let expHTML = "";
          if (isAnswered) {
            const isCorrect = userAnswers[idx] === item.c;
            expHTML = `
              <div class="mt-4 p-4 rounded-xl border ${isCorrect ? "bg-emerald-50/40 border-emerald-100 text-emerald-900" : "bg-slate-50 border-slate-200 text-slate-700"} text-xs md:text-sm">
                <div class="flex items-center gap-1.5 font-bold mb-1">
                  <i class="${isCorrect ? "fa-solid fa-square-check text-emerald-600" : "fa-solid fa-circle-exclamation text-amber-600"}"></i>
                  <span>${isCorrect ? "সঠিক উত্তর!" : "ভুল উত্তর! সঠিক উত্তর: " + prefix[item.c]}</span>
                </div>
                <p class="leading-relaxed font-medium">${escapeHtml(item.e)}</p>
              </div>
            `;
          }

          card.innerHTML = `
            <div class="flex justify-between items-center mb-3">
              <span class="text-xs font-bold text-slate-400">প্রশ্ন ${idx + 1}/100</span>
              <span class="text-[11px] font-semibold px-2.5 py-1 border rounded-full ${item.t === "html" ? "bg-purple-100 text-purple-700" : "bg-amber-100 text-amber-700"}">${item.t.toUpperCase()}</span>
            </div>
            <p class="font-semibold text-base md:text-lg text-slate-900 mb-4">${escapeHtml(item.q)}</p>
            <div class="flex flex-col gap-2.5">${optionsHTML}</div>
            ${expHTML}
          `;
          listContainer.appendChild(card);
        });
      }

      function selectOption(qIdx, optIdx) {
        if (userAnswers[qIdx] !== undefined) return;
        userAnswers[qIdx] = optIdx;
        renderQuestions();
        renderQuestionGrid();
        renderDashboard();
      }

      function renderDashboard() {
        let correct = 0,
          wrong = 0;
        const attempted = Object.keys(userAnswers).length;
        quizDatabase.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined) {
            if (userAnswers[idx] === q.c) correct++;
            else wrong++;
          }
        });
        const score = correct * 1.0 - wrong * 0.25;
        document.getElementById("score-display").innerText = score.toFixed(2);
        document.getElementById("attempted-display").innerText =
          `${attempted}/100`;
        document.getElementById("correct-display").innerText = correct;
        document.getElementById("wrong-display").innerText = wrong;
        const percent = Math.round((attempted / quizDatabase.length) * 100);
        document.getElementById("progress-percent").innerText = `${percent}%`;
        document.getElementById("progress-bar").style.width = `${percent}%`;
      }

      function filterQuestions() {
        currentFilter = document.getElementById("topic-filter").value;
        renderQuestions();
      }

      function resetQuiz() {
        if (
          confirm(
            "আপনি কি কুইজটি পুনরায় শুরু করতে চান? বর্তমান স্কোর মুছে যাবে।",
          )
        ) {
          userAnswers = {};
          currentFilter = "all";
          document.getElementById("topic-filter").value = "all";
          renderDashboard();
          renderQuestionGrid();
          renderQuestions();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }
      }
    </script>
