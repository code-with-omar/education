        --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);

      * {

        margin: 0;
        padding: 0;
        font-family: "Hind Siliguri", "Outfit", sans-serif;
      }

      body {
        background: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-main);
        line-height: 1.7;
        padding: 30px 15px;
        min-height: 100vh;
      }

      .container {
        max-width: 950px;
        margin: 0 auto;
      }

      header {
        background: linear-gradient(

          rgba(99, 102, 241, 0.95),
          rgba(168, 85, 247, 0.95)

        backdrop-filter: blur(10px);
        color: var(--text-light);
        padding: 35px 25px;
        border-radius: var(--radius);

        margin-bottom: 25px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      header h1 {
        font-size: 2.2rem;
        font-weight: 700;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
      }

      header p {
        font-size: 1.1rem;
        opacity: 0.95;
        font-weight: 500;
      }

      .control-panel {
        background: rgba(30, 41, 59, 0.8);
        backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        padding: 22px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 25px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 12px;
        text-align: center;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.08);
        padding: 12px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .stat-card .val {
        font-size: 1.5rem;
        font-weight: 700;
        color: #38bdf8;
        font-family: "Outfit", sans-serif;
      }

      .stat-card .lbl {
        font-size: 0.85rem;
        color: #cbd5e1;
      }

      .filter-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .search-box {
        flex: 1 1 220px;
      }

      .search-box input {
        width: 100%;
        padding: 11px 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        font-size: 0.98rem;
        outline: none;
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-light);

      }

      .search-box input:focus {
        border-color: #818cf8;
        box-shadow: 0 0 10px rgba(129, 140, 248, 0.4);
      }

        padding: 11px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-light);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
      }

      select option {
        background: #1e293b;
        color: #f8fafc;
      }

      .btn-reset {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        border: none;
        font-weight: 600;
        margin-left: auto;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      }

      .btn-reset:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        transform: translateY(-1px);
      }

      .quiz-container {
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .q-card {
        background: var(--card-bg);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border-left: 6px solid var(--primary);
        transition: all 0.2s ease-in-out;
      }

      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
        gap: 10px;
      }

      .badge {
        font-size: 0.8rem;
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: 600;
        background: #e0e7ff;
        color: var(--primary-dark);
      }

      .badge-status {
        background: #f1f5f9;
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .badge-status.correct {
        background: var(--correct-bg);
        color: var(--correct-border);
      }

      .badge-status.wrong {
        background: var(--wrong-bg);
        color: var(--wrong-border);
      }

      .q-text {
        font-size: 1.15rem;
        font-weight: 600;
        color: #0f172a;
        line-height: 1.6;
        margin-bottom: 18px;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      @media (min-width: 640px) {
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .option-btn {
        text-align: left;
        padding: 12px 16px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: #ffffff;
        font-size: 0.98rem;
        color: #334155;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 10px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .option-btn strong {
        color: var(--primary-dark);
      }

      .option-btn:hover:not(:disabled) {
        border-color: #a5b4fc;
        background: #f8fafc;
        transform: translateX(3px);
      }

      .option-btn.selected-correct {
        background: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: #065f46 !important;
        font-weight: 600;
      }

      .option-btn.selected-wrong {
        background: var(--wrong-bg) !important;
        border-color: var(--wrong-border) !important;
        color: #991b1b !important;
        font-weight: 600;
      }

      .option-btn.show-correct {
        background: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: #065f46 !important;
      }

      .explanation-box {
        margin-top: 16px;
        padding: 14px 16px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-left: 4px solid var(--primary);
        font-size: 0.95rem;
        color: #334155;
        display: none;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-4px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .explanation-box.active {
        display: block;
      }

      .explanation-box strong {
        color: var(--primary-dark);
      }

      .no-results {
        text-align: center;
        padding: 40px 20px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: var(--radius);
        color: #475569;
        font-size: 1.1rem;
        font-weight: 500;
      }

      // -------------------------------------------------------------
      // STATE MANAGEMENT & LOCAL STORAGE
      // -------------------------------------------------------------
      let userAnswers = {};
      let startTime = Date.now();
      let timerInterval = null;

      function loadState() {
        const savedAnswers = localStorage.getItem("algo_quiz_job_answers");
        const savedTime = localStorage.getItem("algo_quiz_job_time");

        if (savedAnswers) {
          userAnswers = JSON.parse(savedAnswers);
        }
        if (savedTime) {
          startTime = Date.now() - parseInt(savedTime, 10);
        } else {
          startTime = Date.now();
        }
      }

      function saveState() {
        localStorage.setItem(
          "algo_quiz_job_answers",
          JSON.stringify(userAnswers),
        );
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        localStorage.setItem("algo_quiz_job_time", elapsed.toString());
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
          const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
          const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(
            2,
            "0",
          );
          const secs = String(totalSeconds % 60).padStart(2, "0");

          document.getElementById("time-display").innerText =
            `${hrs}:${mins}:${secs}`;
          saveState();
        }, 1000);
      }

      // -------------------------------------------------------------
      // RENDER & FILTER LOGIC
      // -------------------------------------------------------------
      function renderQuiz() {
        const container = document.getElementById("quiz-container");
        const searchVal = document
          .getElementById("search-input")
          .value.toLowerCase();
        const topicVal = document.getElementById("topic-filter").value;
        const statusVal = document.getElementById("status-filter").value;

        container.innerHTML = "";

        let correctCount = 0;
        let answeredCount = Object.keys(userAnswers).length;

        rawQuestions.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined && userAnswers[idx] === q.ans) {
            correctCount++;
          }
        });

        document.getElementById("score-display").innerText =
          `${correctCount}/120`;
        document.getElementById("answered-display").innerText = answeredCount;
        const accuracy =
          answeredCount > 0
            ? Math.round((correctCount / answeredCount) * 100)
            : 0;
        document.getElementById("accuracy-display").innerText = `${accuracy}%`;

        let visibleCount = 0;

        rawQuestions.forEach((q, idx) => {
          const isAnswered = userAnswers[idx] !== undefined;
          const isCorrect = isAnswered && userAnswers[idx] === q.ans;
          const isWrong = isAnswered && userAnswers[idx] !== q.ans;

          if (statusVal === "unanswered" && isAnswered) return;
          if (statusVal === "correct" && !isCorrect) return;
          if (statusVal === "wrong" && !isWrong) return;

          if (topicVal !== "all" && q.topic !== topicVal) return;

          const textToSearch = (
            q.q +
            " " +
            q.options.join(" ") +
            " " +
            q.topic
          ).toLowerCase();
          if (searchVal && !textToSearch.includes(searchVal)) return;

          visibleCount++;

          const card = document.createElement("div");
          card.className = "q-card";

          let statusBadge = `<span class="badge badge-status">উত্তর দেওয়া হয়নি</span>`;
          if (isCorrect)
            statusBadge = `<span class="badge badge-status correct">✓ সঠিক</span>`;
          if (isWrong)
            statusBadge = `<span class="badge badge-status wrong">✕ ভুল</span>`;

          let optionsHtml = "";
          q.options.forEach((opt, optIdx) => {
            let btnClass = "option-btn";

            if (isAnswered) {
              if (optIdx === q.ans) {
                btnClass += " show-correct";
              }
              if (userAnswers[idx] === optIdx) {
                btnClass +=
                  optIdx === q.ans ? " selected-correct" : " selected-wrong";
              }
            }

            optionsHtml += `
        <button class="${btnClass}" 
                onclick="handleAnswer(${idx}, ${optIdx})" 
                ${isAnswered ? "disabled" : ""}>
          <strong>${String.fromCharCode(65 + optIdx)}.</strong> ${opt}
        </button>
      `;
          });

          card.innerHTML = `
      <div class="q-header">
        <div class="q-meta">
          <span class="badge">প্রশ্ন ${idx + 1}</span>
          <span class="badge" style="background:#f3e8ff; color:#6b21a8;">${q.topic}</span>
        </div>
        ${statusBadge}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options-grid">${optionsHtml}</div>
      <div class="explanation-box ${isAnswered ? "active" : ""}">
        <strong>💡 ব্যাখ্যা:</strong> ${q.exp}
      </div>
    `;

          container.appendChild(card);
        });

        if (visibleCount === 0) {
          container.innerHTML = `<div class="no-results">কোনো প্রশ্ন পাওয়া যায়নি! ফিল্টার বা সার্চ শব্দ পরিবর্তন করুন।</div>`;
        }
      }

      function handleAnswer(qIndex, optionIndex) {
        if (userAnswers[qIndex] !== undefined) return;
        userAnswers[qIndex] = optionIndex;
        saveState();
        renderQuiz();
      }

      function resetQuiz() {
        if (
          confirm(
            "আপনি কি নিশ্চিত যে সমস্ত উত্তর এবং টাইম হিস্টোরি রিসেট করতে চান?",
          )
        ) {
          localStorage.removeItem("algo_quiz_job_answers");
          localStorage.removeItem("algo_quiz_job_time");
          userAnswers = {};
          startTime = Date.now();
          renderQuiz();
        }
      }

      document
        .getElementById("search-input")
        .addEventListener("input", renderQuiz);
      document
        .getElementById("topic-filter")
        .addEventListener("change", renderQuiz);
      document
        .getElementById("status-filter")
        .addEventListener("change", renderQuiz);

      window.onload = () => {
        loadState();
        startTimer();
        renderQuiz();
      };
    </script>
