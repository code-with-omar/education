    <style>
      :root {
        /* Dynamic Modern Palette (Comfortable Reading Theme) */
        --primary: #6366f1;
        --primary-dark: #4f46e5;
        --primary-light: #eeef2e1;
        --bg-gradient: linear-gradient(
          135deg,
          #0f172a 0%,
          #1e1b4b 50%,
          #0f172a 100%
        );
        --card-bg: rgba(255, 255, 255, 0.96);
        --card-border: rgba(255, 255, 255, 0.2);
        --text-main: #1e293b;
        --text-muted: #64748b;
        --text-light: #f8fafc;

        --correct: #10b981;
        --correct-bg: #d1fae5;
        --correct-border: #059669;

        --wrong: #ef4444;
        --wrong-bg: #fee2e2;
        --wrong-border: #dc2626;

        --accent-glow: rgba(99, 102, 241, 0.25);
        --radius: 16px;
        --shadow:
          0 10px 25px -5px rgba(0, 0, 0, 0.2),
          0 8px 10px -6px rgba(0, 0, 0, 0.1);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Hind Siliguri", "Outfit", sans-serif;
      }

      body {
        background: var(--bg-gradient);
        background-attachment: fixed;
        color: var(--text-main);
        line-height: 1.7;
        padding: 30px 12px;
        min-height: 100vh;
      }

      .container {
        max-width: 950px;
        margin: 0 auto;
      }

      /* Vibrant Header */
      header {
        background: linear-gradient(
          135deg,
          rgba(99, 102, 241, 0.9),
          rgba(168, 85, 247, 0.9)
        );
        backdrop-filter: blur(10px);
        color: var(--text-light);
        padding: 35px 25px;
        border-radius: var(--radius);
        box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.4);
        margin-bottom: 30px;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      header h1 {
        font-size: 2.3rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        margin-bottom: 10px;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
      }

      header p {
        font-size: 1.15rem;
        font-weight: 500;
        opacity: 0.95;
      }

      /* Control Panel Glassmorphism */
      .control-panel {
        background: rgba(30, 41, 59, 0.7);
        backdrop-filter: blur(12px);
        border: 1px solid var(--card-border);
        padding: 24px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        margin-bottom: 25px;
        display: flex;
        flex-direction: column;
        gap: 20px;
      }

      .stats-bar {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 15px;
        text-align: center;
      }

      .stat-card {
        background: rgba(255, 255, 255, 0.08);
        padding: 15px 10px;
        border-radius: 12px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        transition: transform 0.2s;
      }

      .stat-card:hover {
        transform: translateY(-2px);
        background: rgba(255, 255, 255, 0.12);
      }

      .stat-card .val {
        font-size: 1.6rem;
        font-weight: 700;
        color: #38bdf8;
        font-family: "Outfit", sans-serif;
      }

      .stat-card .lbl {
        font-size: 0.88rem;
        color: #cbd5e1;
        font-weight: 500;
      }

      .filter-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        align-items: center;
      }

      .search-box {
        flex: 1 1 240px;
      }

      .search-box input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 10px;
        font-size: 1rem;
        outline: none;
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-light);
        transition: all 0.3s;
      }

      .search-box input::placeholder {
        color: #94a3b8;
      }

      .search-box input:focus {
        border-color: #818cf8;
        box-shadow: 0 0 12px rgba(129, 140, 248, 0.4);
      }

      select,
      button {
        padding: 12px 16px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(15, 23, 42, 0.6);
        color: var(--text-light);
        font-size: 0.95rem;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        transition: all 0.2s;
      }

      select option {
        background: #1e293b;
        color: #f8fafc;
      }

      select:focus,
      button:hover {
        border-color: #818cf8;
      }

      .btn-reset {
        background: linear-gradient(135deg, #ef4444, #dc2626);
        color: white;
        border: none;
        font-weight: 600;
        margin-left: auto;
        box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
      }

      .btn-reset:hover {
        background: linear-gradient(135deg, #dc2626, #b91c1c);
        transform: translateY(-1px);
      }

      /* Question Cards Styling */
      .quiz-container {
        display: flex;
        flex-direction: column;
        gap: 22px;
      }

      .q-card {
        background: var(--card-bg);
        padding: 24px 28px;
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        border-left: 6px solid var(--primary);
        transition: all 0.2s ease-in-out;
      }

      .q-card:hover {
        box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.25);
      }

      .q-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
        gap: 10px;
      }

      .q-meta {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .badge {
        font-size: 0.82rem;
        padding: 4px 12px;
        border-radius: 20px;
        font-weight: 600;
        background: #e0e7ff;
        color: var(--primary-dark);
        letter-spacing: 0.3px;
      }

      .badge-status {
        background: #f1f5f9;
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      .badge-status.correct {
        background: var(--correct-bg);
        color: var(--correct-border);
      }

      .badge-status.wrong {
        background: var(--wrong-bg);
        color: var(--wrong-border);
      }

      .q-text {
        font-size: 1.18rem;
        font-weight: 600;
        color: #0f172a;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      .options-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 12px;
      }

      @media (min-width: 650px) {
        .options-grid {
          grid-template-columns: 1fr 1fr;
        }
      }

      .option-btn {
        text-align: left;
        padding: 14px 18px;
        border: 2px solid #e2e8f0;
        border-radius: 12px;
        background: #ffffff;
        font-size: 1.02rem;
        color: #334155;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 12px;
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .option-btn strong {
        color: var(--primary-dark);
        font-size: 1.05rem;
      }

      .option-btn:hover:not(:disabled) {
        border-color: #a5b4fc;
        background: #f8fafc;
        transform: translateX(3px);
      }

      .option-btn.selected-correct {
        background: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: #065f46 !important;
        font-weight: 600;
      }

      .option-btn.selected-wrong {
        background: var(--wrong-bg) !important;
        border-color: var(--wrong-border) !important;
        color: #991b1b !important;
        font-weight: 600;
      }

      .option-btn.show-correct {
        background: var(--correct-bg) !important;
        border-color: var(--correct-border) !important;
        color: #065f46 !important;
      }

      .explanation-box {
        margin-top: 18px;
        padding: 16px 18px;
        border-radius: 12px;
        background: #f8fafc;
        border: 1px solid #cbd5e1;
        border-left: 4px solid var(--primary);
        font-size: 0.98rem;
        color: #334155;
        display: none;
        animation: fadeIn 0.3s ease;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-5px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .explanation-box.active {
        display: block;
      }

      .explanation-box strong {
        color: var(--primary-dark);
        font-size: 1.02rem;
      }

      .no-results {
        text-align: center;
        padding: 50px 20px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: var(--radius);
        color: #475569;
        font-size: 1.1rem;
        font-weight: 500;
      }

      pre,
      code {
        background: #e2e8f0;
        padding: 3px 8px;
        border-radius: 6px;
        font-family: monospace;
        font-size: 0.95em;
        color: #0f172a;
      }
    </style>
  </head>

    <script>
      // -------------------------------------------------------------
      // QUESTION DATA (100 High-Quality Job Level MCQs)
      // -------------------------------------------------------------
      const rawQuestions = [
        // Introduction & Basics (10)
        {
          topic: "Introduction",
          q: "অ্যালগরিদমের সঠিকতার (Correctness) জন্য কোন দুটি অংশ প্রমাণ করতে হয়?",
          options: [
            "Time & Space Complexity",
            "Partial Correctness & Termination",
            "Input & Output Validation",
            "Recursion & Iteration",
          ],
          ans: 1,
          exp: "অ্যালগরিদমের সঠিকতা প্রমাণে Total Correctness = Partial Correctness (ভুল আউটপুট দেবে না) + Termination (অসীম লুপে আটকে না থেকে শেষ হবে)।",
        },
        {
          topic: "Introduction",
          q: "অ্যালগরিদমের Worst-case সময় জটিলতা প্রকাশের জন্য কোনটি ব্যবহৃত হয়?",
          options: ["Big-O (O)", "Big-Omega (Ω)", "Big-Theta (Θ)", "Little-o"],
          ans: 0,
          exp: "Big-O নোটেশন দ্বারা অ্যালগরিদমের Upper Bound বা Worst-case সময় জটিলতা নির্দেশ করা হয়।",
        },
        {
          topic: "Introduction",
          q: "লুপ ইনভেরিয়েন্ট (Loop Invariant) প্রমাণের ৩টি ধাপ কী কী?",
          options: [
            "Start, Run, Stop",
            "Initialization, Maintenance, Termination",
            "Base, Hypo, Step",
            "Input, Process, Output",
          ],
          ans: 1,
          exp: "Mathematical Induction-এর মতো লুপ ইনভেরিয়েন্টের ৩টি ধাপ হলো: Initialization (লুপের আগে সত্য), Maintenance (প্রতি Iteration-এ সত্য), এবং Termination (লুপ শেষে সঠিক ফলাফল)।",
        },
        {
          topic: "Introduction",
          q: " asymptotic notations এর ক্ষেত্রে কোনটি Tight Bound প্রকাশ করে?",
          options: ["Big-O", "Big-Omega", "Big-Theta (Θ)", "Small-oh"],
          ans: 2,
          exp: "Big-Theta (Θ) নোটেশন অ্যালগরিদমের Average/Exact asymptotic growth নির্দেশ করে, যা Tight Bound।",
        },
        {
          topic: "Introduction",
          q: "f(n) = 3n^2 + 5n + 2 হলে এর Asymptotic Complexity কত?",
          options: ["O(n)", "O(n log n)", "O(n^2)", "O(1)"],
          ans: 2,
          exp: "সর্বোচ্চ ঘাতের টার্ম n^2 গ্রহণ করা হয় এবং ধ্রুবক বাদ দেওয়া হয়, ফলে জটিলতা O(n^2)।",
        },
        {
          topic: "Introduction",
          q: "ইনসার্শন সর্ট (Insertion Sort) এর Best-case সময় জটিলতা কত?",
          options: ["O(n^2)", "O(n log n)", "O(n)", "O(1)"],
          ans: 2,
          exp: "অ্যারে আগে থেকেই সর্ট করা থাকলে Insertion Sort-এ শুধু n-1 টি তুলনা লাগে, তাই Best-case O(n)।",
        },
        {
          topic: "Introduction",
          q: "Recursion-এর সময় জটিলতা বের করার জন্য কোন সূত্রটি বহুল ব্যবহৃত?",
          options: [
            "Euler's Formula",
            "Master Theorem",
            "Lagrange Theorem",
            "Bayes Theorem",
          ],
          ans: 1,
          exp: "Divide and Conquer টাইপ রিকার্সিভ সমীকরণ T(n) = aT(n/b) + f(n) সমাধানের জন্য Master Theorem ব্যবহৃত হয়।",
        },
        {
          topic: "Introduction",
          q: "কোন অ্যালগরিদমটি ইন-প্লেস (In-place) সর্টিং অ্যালগরিদম নয়?",
          options: ["Quick Sort", "Heap Sort", "Merge Sort", "Insertion Sort"],
          ans: 2,
          exp: "Merge Sort-এ উপাদানগুলো মার্জ করার জন্য O(n) অতিরিক্ত মেমরি স্পেস প্রয়োজন হয়।",
        },
        {
          topic: "Introduction",
          q: "Space Complexity বলতে কী বোঝায়?",
          options: [
            "কোড লিখতে ব্যবহৃত জায়গা",
            "হার্ডডিস্কের সাইজ",
            "অ্যালগরিদম চালানোর জন্য প্রয়োজনীয় অতিরিক্ত মেমরি",
            "CPU চালনার সময়",
          ],
          ans: 2,
          exp: "ইনপুট সাইজের সাপেক্ষে অ্যালগরিদম কার্যকর হতে মেমরিতে অতিরিক্ত যে জায়গা নেয় তাই Space Complexity।",
        },
        {
          topic: "Introduction",
          q: "স্থান ও কালের ট্রেড-অফ (Space-Time Trade-off) বলতে কী বোঝায়?",
          options: [
            "মেমরি কমালে রানটাইম বাড়ে বা রানটাইম কমালে মেমরি বেশি লাগে",
            "মেমরি ও রানটাইম একসাথে কমানো",
            "কোড ছোট করা",
            "কম্পিউটার স্পিড বাড়ানো",

          exp: "সবসময় ছোট সাইজের দুটি ফাইল আগে মার্জ করতে Min-Heap ভিত্তিক Priority Queue দিয়ে Huffman Tree টাইপ অ্যাপ্রোচ নেওয়া হয়।",
        },
        {
          topic: "Divide & Conquer",
          q: "Master Theorem দিয়ে T(n) = 4T(n/2) + n^2 সমাধান করলে জটিলতা কত হবে?",
          options: ["O(n^2)", "O(n^2 log n)", "O(n^3)", "O(n log n)"],
          ans: 1,
          exp: "a=4, b=2 => log_2(4) = 2। f(n) = n^2 = Θ(n^2)। যেহেতু f(n) = Θ(n^(log_b a)), এটি Case 2 অনুযায়ী O(n^2 log n)।",
        },
        {
          topic: "Dynamic Programming",
          q: "Traveling Salesperson Problem (TSP) DP দিয়ে সমাধান করলে সময় জটিলতা কত হয়?",
          options: ["O(N!)", "O(2^N * N^2)", "O(N^3)", "O(2^N)"],
          ans: 1,
          exp: "Brute force-এ TSP O(N!) হলেও DP + Bitmasking ব্যবহার করে সময় জটিলতা O(2^N * N^2) এ নামিয়ে আনা সম্ভব।",
        },
      ];

      // -------------------------------------------------------------
      // STATE MANAGEMENT & LOCAL STORAGE
      // -------------------------------------------------------------
      let userAnswers = {};
      let startTime = Date.now();
      let timerInterval = null;

      function loadState() {
        const savedAnswers = localStorage.getItem("algo_quiz_answers");
        const savedTime = localStorage.getItem("algo_quiz_time");

        if (savedAnswers) {
          userAnswers = JSON.parse(savedAnswers);
        }
        if (savedTime) {
          startTime = Date.now() - parseInt(savedTime, 10);
        } else {
          startTime = Date.now();
        }
      }

      function saveState() {
        localStorage.setItem("algo_quiz_answers", JSON.stringify(userAnswers));
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        localStorage.setItem("algo_quiz_time", elapsed.toString());
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          const totalSeconds = Math.floor((Date.now() - startTime) / 1000);
          const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, "0");
          const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(
            2,
            "0",
          );
          const secs = String(totalSeconds % 60).padStart(2, "0");

          document.getElementById("time-display").innerText =
            `${hrs}:${mins}:${secs}`;
          saveState();
        }, 1000);
      }

      // -------------------------------------------------------------
      // RENDER & FILTER LOGIC
      // -------------------------------------------------------------
      function renderQuiz() {
        const container = document.getElementById("quiz-container");
        const searchVal = document
          .getElementById("search-input")
          .value.toLowerCase();
        const topicVal = document.getElementById("topic-filter").value;
        const statusVal = document.getElementById("status-filter").value;

        container.innerHTML = "";

        let correctCount = 0;
        let answeredCount = Object.keys(userAnswers).length;

        rawQuestions.forEach((q, idx) => {
          if (userAnswers[idx] !== undefined && userAnswers[idx] === q.ans) {
            correctCount++;
          }
        });

        document.getElementById("score-display").innerText =
          `${correctCount}/100`;
        document.getElementById("answered-display").innerText = answeredCount;
        const accuracy =
          answeredCount > 0
            ? Math.round((correctCount / answeredCount) * 100)
            : 0;
        document.getElementById("accuracy-display").innerText = `${accuracy}%`;

        let visibleCount = 0;

        rawQuestions.forEach((q, idx) => {
          const isAnswered = userAnswers[idx] !== undefined;
          const isCorrect = isAnswered && userAnswers[idx] === q.ans;
          const isWrong = isAnswered && userAnswers[idx] !== q.ans;

          if (statusVal === "unanswered" && isAnswered) return;
          if (statusVal === "correct" && !isCorrect) return;
          if (statusVal === "wrong" && !isWrong) return;

          if (topicVal !== "all" && q.topic !== topicVal) return;

          const textToSearch = (
            q.q +
            " " +
            q.options.join(" ") +
            " " +
            q.topic
          ).toLowerCase();
          if (searchVal && !textToSearch.includes(searchVal)) return;

          visibleCount++;

          const card = document.createElement("div");
          card.className = "q-card";

          let statusBadge = `<span class="badge badge-status">উত্তর দেওয়া হয়নি</span>`;
          if (isCorrect)
            statusBadge = `<span class="badge badge-status correct">✓ সঠিক</span>`;
          if (isWrong)
            statusBadge = `<span class="badge badge-status wrong">✕ ভুল</span>`;

          let optionsHtml = "";
          q.options.forEach((opt, optIdx) => {
            let btnClass = "option-btn";

            if (isAnswered) {
              if (optIdx === q.ans) {
                btnClass += " show-correct";
              }
              if (userAnswers[idx] === optIdx) {
                btnClass +=
                  optIdx === q.ans ? " selected-correct" : " selected-wrong";
              }
            }

            optionsHtml += `
        <button class="${btnClass}" 
                onclick="handleAnswer(${idx}, ${optIdx})" 
                ${isAnswered ? "disabled" : ""}>
          <strong>${String.fromCharCode(65 + optIdx)}.</strong> ${opt}
        </button>
      `;
          });

          card.innerHTML = `
      <div class="q-header">
        <div class="q-meta">
          <span class="badge">প্রশ্ন ${idx + 1}</span>
          <span class="badge" style="background:#f3e8ff; color:#6b21a8;">${q.topic}</span>
        </div>
        ${statusBadge}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options-grid">${optionsHtml}</div>
      <div class="explanation-box ${isAnswered ? "active" : ""}">
        <strong>💡 সঠিক উত্তর ও ব্যাখ্যা:</strong> ${q.exp}
      </div>
    `;

          container.appendChild(card);
        });

        if (visibleCount === 0) {
          container.innerHTML = `<div class="no-results">কোনো প্রশ্ন পাওয়া যায়নি! ফিল্টার পরিবর্তন করে চেষ্টা করুন।</div>`;
        }
      }

      function handleAnswer(qIndex, optionIndex) {
        if (userAnswers[qIndex] !== undefined) return;
        userAnswers[qIndex] = optionIndex;
        saveState();
        renderQuiz();
      }

      function resetQuiz() {
        if (
          confirm("আপনি কি নিশ্চিত যে সমস্ত উত্তর এবং টাইমার রিসেট করতে চান?")
        ) {
          localStorage.removeItem("algo_quiz_answers");
          localStorage.removeItem("algo_quiz_time");
          userAnswers = {};
          startTime = Date.now();
          renderQuiz();
        }
      }

      document
        .getElementById("search-input")
        .addEventListener("input", renderQuiz);
      document
        .getElementById("topic-filter")
        .addEventListener("change", renderQuiz);
      document
        .getElementById("status-filter")
        .addEventListener("change", renderQuiz);

      window.onload = () => {
        loadState();
        startTimer();
        renderQuiz();
      };
    </script>
  </body>
</html>
