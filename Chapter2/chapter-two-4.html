      const container = document.getElementById("quiz-container");

      quizData.forEach((item, index) => {
        const quizItem = document.createElement("div");
        quizItem.className = "quiz-item";

        const questionDiv = document.createElement("div");
        questionDiv.className = "question";
        questionDiv.innerText = item.q;
        quizItem.appendChild(questionDiv);

        const optionsDiv = document.createElement("div");
        optionsDiv.className = "options";

        [item.a, item.b, item.c, item.d].forEach((opt) => {
          if (opt) {
            const optDiv = document.createElement("div");
            optDiv.className = "option";
            optDiv.innerText = opt;
            optionsDiv.appendChild(optDiv);
          }
        });
        quizItem.appendChild(optionsDiv);

        const actionsDiv = document.createElement("div");
        actionsDiv.className = "actions";

        const btn = document.createElement("button");
        btn.className = "btn-toggle";
        btn.innerText = "Show Answer";

        const ansBox = document.createElement("div");
        ansBox.className = "answer-box";
        ansBox.innerText = `সঠিক উত্তর: ${item.ans}`;

        btn.onclick = function () {
          if (ansBox.style.display === "block") {
            ansBox.style.display = "none";
            btn.innerText = "Show Answer";
            btn.style.backgroundColor = "#2ecc71";
          } else {
            ansBox.style.display = "block";
            btn.innerText = "Hide Answer";
            btn.style.backgroundColor = "#e74c3c";
          }
        };

        actionsDiv.appendChild(btn);
        actionsDiv.appendChild(ansBox);
        quizItem.appendChild(actionsDiv);

        container.appendChild(quizItem);
      });
