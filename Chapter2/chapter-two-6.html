<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Software Engineering</title>
    <style>
      :root {
        --bg: #f0f2f5;
        --card-bg: #ffffff;
        --primary: #1a73e8;
        --correct: #0d904f;
        --wrong: #d93025;
        --text: #202124;
        --text-light: #5f6368;
        --border: #dadce0;
        --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        --hover: #e8f0fe;
        --badge-bg: #e8f0fe;
        --badge-text: #1a73e8;
        --explain-bg: #f8f9fa;
        --gold: #f9ab00;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Segoe UI", "Noto Sans Bengali", Tahoma, Geneva, Verdana, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.6;
        min-height: 100vh;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px;
      }

      header {
        background: linear-gradient(135deg, #1a3c6e 0%, #1a73e8 100%);
        color: #fff;
        padding: 28px 24px;
        border-radius: 16px;
        margin-bottom: 20px;
        text-align: center;
        box-shadow: 0 4px 20px rgba(26, 115, 232, 0.3);
        position: relative;
        overflow: hidden;
      }
      header::after {
        content: "";
        position: absolute;
        top: -50%;
        right: -20%;
        width: 300px;
        height: 300px;
        background: rgba(255, 255, 255, 0.04);
        border-radius: 50%;
      }
      header h1 {
        font-size: 1.8em;
        font-weight: 700;
        margin-bottom: 6px;
        position: relative;
        z-index: 1;
      }
      header p {
        font-size: 0.95em;
        opacity: 0.9;
        position: relative;
        z-index: 1;
      }
      header .badge-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        margin-top: 10px;
        position: relative;
        z-index: 1;
      }
      header .badge-row span {
        background: rgba(255, 255, 255, 0.2);
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 0.8em;
        backdrop-filter: blur(4px);
      }
      /* Header Section Style */
      .header-container {
        text-align: center;
        padding: 2.5rem 1rem;
        background-color: #f8fafc;
        border-bottom: 2px solid #e2e8f0;
        font-family: "Segoe UI", Roboto, sans-serif;
      }

      .header-container h1 {
        color: #0f172a;
        font-size: 1.8rem;
        margin-bottom: 1.5rem;
      }

      /* Navigation Container */
      .nav-buttons {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap; /* মোবাইলে অটোমেটিক রেসপনসিভ করার জন্য */
      }

      /* Button Design */
      .nav-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 10px 22px;
        font-size: 0.95rem;
        font-weight: 600;
        color: #ffffff;
        background-color: #2563eb; /* Modern Blue */
        text-decoration: none;
        border-radius: 8px;
        box-shadow: 0 2px 6px rgba(37, 99, 235, 0.25);
        transition: all 0.2s ease-in-out;
      }

      /* Hover & Active Effects */
      .nav-btn:hover {
        background-color: #1d4ed8;
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
      }

      .nav-btn:active {
        transform: translateY(0);
      }
      .stats-bar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-bottom: 20px;
        background: var(--card-bg);
        padding: 16px 20px;
        border-radius: 12px;
        box-shadow: var(--shadow);
        position: sticky;
        top: 10px;
        z-index: 100;
      }
      .stat-item {
        text-align: center;
        min-width: 60px;
      }
      .stat-item .num {
        font-size: 1.6em;
        font-weight: 700;
        color: var(--primary);
      }
      .stat-item .lbl {
        font-size: 0.75em;
        color: var(--text-light);
      }
      .stat-item.correct .num {
        color: var(--correct);
      }
      .stat-item.wrong .num {
        color: var(--wrong);
      }
      .stat-item.remain .num {
        color: var(--gold);
      }

      .topic-filter {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 16px;
        justify-content: center;
      }
      .topic-filter button {
        padding: 7px 14px;
        border: 1.5px solid var(--border);
        background: #fff;
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.82em;
        transition: all 0.2s;
        white-space: nowrap;
        font-weight: 500;
      }
      .topic-filter button:hover,
      .topic-filter button.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      .progress-wrap {
        margin-bottom: 20px;
        background: #e0e0e0;
        border-radius: 10px;
        height: 6px;
        overflow: hidden;
      }
      .progress-fill {
        height: 100%;
        background: var(--primary);
        border-radius: 10px;
        transition: width 0.4s ease;
        width: 0%;
      }

      .question-card {
        background: var(--card-bg);
        border-radius: 14px;
        padding: 24px 22px;
        margin-bottom: 16px;
        box-shadow: var(--shadow);
        border-left: 5px solid transparent;
        transition: all 0.25s;
        position: relative;
      }
      .question-card:hover {
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      }
      .question-card.answered-correct {
        border-left-color: var(--correct);
        background: #f6fdf8;
      }
      .question-card.answered-wrong {
        border-left-color: var(--wrong);
        background: #fef7f6;
      }
      .q-num {
        display: inline-block;
        background: var(--badge-bg);
        color: var(--badge-text);
        font-weight: 700;
        font-size: 0.85em;
        padding: 3px 10px;
        border-radius: 12px;
        margin-bottom: 8px;
      }
      .q-topic {
        display: inline-block;
        font-size: 0.75em;
        color: var(--text-light);
        margin-left: 6px;
        font-style: italic;
      }
      .q-text {
        font-weight: 600;
        font-size: 1.05em;
        margin-bottom: 14px;
        color: #1a1a1a;
      }
      .options {
        list-style: none;
        display: grid;
        gap: 8px;
      }
      .options li {
        padding: 12px 16px;
        border: 1.5px solid var(--border);
        border-radius: 10px;
        cursor: pointer;
        transition: all 0.2s;
        font-size: 0.95em;
        position: relative;
        user-select: none;
        background: #fafbfc;
      }
      .options li:hover {
        background: var(--hover);
        border-color: #a0c4f1;
      }
      .options li.selected {
        border-color: var(--primary);
        background: #e8f0fe;
        font-weight: 600;
      }
      .options li.correct-choice {
        border-color: var(--correct) !important;
        background: #e6f4ea !important;
        color: #0d5e30 !important;
        font-weight: 700;
      }
      .options li.wrong-choice {
        border-color: var(--wrong) !important;
        background: #fce8e6 !important;
        color: #a50e0e !important;
      }
      .options li .icon-feedback {
        position: absolute;
        right: 14px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.3em;
        display: none;
      }
      .options li.correct-choice .icon-feedback,
      .options li.wrong-choice .icon-feedback {
        display: inline;
      }
      .options li.disabled {
        pointer-events: none;
        opacity: 0.85;
      }

      .answer-reveal {
        margin-top: 12px;
        padding: 14px 16px;
        background: var(--explain-bg);
        border-radius: 10px;
        display: none;
        border: 1px dashed #ccc;
        font-size: 0.9em;
      }
      .answer-reveal.show {
        display: block;
        animation: fadeIn 0.3s ease;
      }
      .answer-reveal .ans-label {
        font-weight: 700;
        color: var(--correct);
      }
      .answer-reveal .explain-label {
        font-weight: 700;
        color: #555;
        margin-top: 6px;
        display: block;
      }
      .answer-reveal .explain-text {
        color: #444;
        margin-top: 2px;
      }
      .show-answer-btn {
        margin-top: 10px;
        padding: 7px 16px;
        background: #fff;
        border: 1.5px solid var(--primary);
        color: var(--primary);
        border-radius: 20px;
        cursor: pointer;
        font-size: 0.85em;
        transition: all 0.2s;
        font-weight: 500;
      }
      .show-answer-btn:hover {
        background: var(--primary);
        color: #fff;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(-6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .btn-reset {
        display: block;
        margin: 24px auto;
        padding: 12px 32px;
        background: var(--primary);
        color: #fff;
        border: none;
        border-radius: 25px;
        font-size: 1em;
        cursor: pointer;
        font-weight: 600;
        transition: all 0.2s;
        box-shadow: 0 3px 12px rgba(26, 115, 232, 0.3);
      }
      .btn-reset:hover {
        background: #1557b0;
        box-shadow: 0 5px 18px rgba(26, 115, 232, 0.4);
        transform: translateY(-1px);
      }

      .no-results {
        text-align: center;
        padding: 40px;
        color: var(--text-light);
        font-size: 1.1em;
      }

      footer {
        text-align: center;
        color: var(--text-light);
        font-size: 0.8em;
        padding: 20px;
      }

      @media (max-width: 600px) {
        header h1 {
          font-size: 1.3em;
        }
        .question-card {
          padding: 16px 12px;
        }
        .options li {
          padding: 10px 12px;
          font-size: 0.88em;
        }
        .q-text {
          font-size: 0.95em;
        }
        .stats-bar {
          gap: 6px;
          padding: 10px 8px;
        }
        .stat-item .num {
          font-size: 1.2em;
        }
      }
    </style>
  </head>

          q: "DSDM (Dynamic Systems Development Method) is:",
          options: [
            "A type of database",
            "An Agile project delivery framework",
            "A programming language",
            "A testing tool",
          ],
          answer: 1,
          explain:
            "DSDM is an Agile framework that emphasizes full project lifecycle, user involvement, and iterative delivery.",
        },
        {
          id: 196,
          topic: "Development Models",
          q: "Which model uses the concept of 'time-boxing' most prominently?",
          options: [
            "Waterfall",
            "RAD and Agile models",
            "Spiral",
            "Code-and-fix",
          ],
          answer: 1,
          explain:
            "RAD and Agile models use time-boxing—fixed time periods for delivering specific features or completing iterations.",
        },
        {
          id: 197,
          topic: "Development Models",
          q: "A disadvantage of the RAD model is:",
          options: [
            "Too slow",
            "Requires highly skilled developers and strong user involvement",
            "No prototyping",
            "Excessive documentation",
          ],
          answer: 1,
          explain:
            "RAD demands highly competent developers and continuous, intensive user involvement, which may not always be feasible.",
        },
        {
          id: 198,
          topic: "Development Models",
          q: "The Spiral model is particularly suited for:",
          options: [
            "Small, low-risk projects",
            "Large, complex, high-risk projects",
            "Projects with fixed requirements",
            "One-person projects",
          ],
          answer: 1,
          explain:
            "The Spiral model's emphasis on iterative risk analysis makes it ideal for large, complex projects with significant risks.",
        },
        {
          id: 199,
          topic: "Development Models",
          q: "In the Evolutionary model, the system:",
          options: [
            "Is built once",
            "Evolves through multiple versions with increasing functionality",
            "Has no changes",
            "Is never completed",
          ],
          answer: 1,
          explain:
            "The Evolutionary model develops software through successive versions, each adding more features based on user feedback.",
        },
        {
          id: 200,
          topic: "Development Models",
          q: "Which is a key principle of the Agile Manifesto?",
          options: [
            "Rigid planning",
            "Responding to change over following a plan",
            "Avoiding customer contact",
            "Maximizing documentation",
          ],
          answer: 1,
          explain:
            "The Agile Manifesto states: 'Responding to change over following a plan.'",
        },
      ];

      // ==================== MAIN APPLICATION LOGIC ====================
      let userAnswers = {}; // { questionId: selectedOptionIndex }
      let revealedAnswers = {}; // { questionId: true/false }

      const questionsContainer = document.getElementById("questionsContainer");
      const topicFilter = document.getElementById("topicFilter");
      const correctCountEl = document.getElementById("correctCount");
      const wrongCountEl = document.getElementById("wrongCount");
      const remainCountEl = document.getElementById("remainCount");
      const scorePctEl = document.getElementById("scorePct");
      const progressFill = document.getElementById("progressFill");

      // Get unique topics
      const topics = [...new Set(allQuestions.map((q) => q.topic))];

      // Render topic filter buttons
      function renderTopicFilter() {
        topicFilter.innerHTML =
          '<button class="active" data-topic="all">📋 All Topics</button>';
        topics.forEach((topic) => {
          const btn = document.createElement("button");
          btn.textContent = topic;
          btn.dataset.topic = topic;
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".topic-filter button")
              .forEach((b) => b.classList.remove("active"));
            btn.classList.add("active");
            renderQuestions(btn.dataset.topic);
          });
          topicFilter.appendChild(btn);
        });
        document
          .querySelector('.topic-filter button[data-topic="all"]')
          .addEventListener("click", () => {
            document
              .querySelectorAll(".topic-filter button")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelector('.topic-filter button[data-topic="all"]')
              .classList.add("active");
            renderQuestions("all");
          });
      }

      function renderQuestions(filterTopic = "all") {
        const filtered =
          filterTopic === "all"
            ? allQuestions
            : allQuestions.filter((q) => q.topic === filterTopic);
        questionsContainer.innerHTML = "";

        if (filtered.length === 0) {
          questionsContainer.innerHTML =
            '<div class="no-results">No questions found for this topic.</div>';
          return;
        }

        filtered.forEach((q) => {
          const card = document.createElement("div");
          card.className = "question-card";
          card.id = "q-card-" + q.id;

          // Update card border based on answer
          if (userAnswers[q.id] !== undefined) {
            if (userAnswers[q.id] === q.answer) {
              card.classList.add("answered-correct");
            } else {
              card.classList.add("answered-wrong");
            }
          }

          card.innerHTML = `
                    <span class="q-num">Q${q.id}</span>
                    <span class="q-topic">[${q.topic}]</span>
                    <div class="q-text">${q.q}</div>
                    <ul class="options" id="options-${q.id}">
                        ${q.options
                          .map((opt, idx) => {
                            const letter = String.fromCharCode(65 + idx);
                            let cls = "";
                            if (userAnswers[q.id] !== undefined) {
                              cls += " disabled";
                              if (idx === userAnswers[q.id]) cls += " selected";
                              if (idx === q.answer) cls += " correct-choice";
                              if (idx === userAnswers[q.id] && idx !== q.answer)
                                cls += " wrong-choice";
                            }
                            return `<li class="${cls}" data-qid="${q.id}" data-opt="${idx}">
                                <strong>${letter}.</strong> ${opt}
                                <span class="icon-feedback">${idx === q.answer ? "✅" : userAnswers[q.id] === idx && idx !== q.answer ? "❌" : ""}</span>
                            </li>`;
                          })
                          .join("")}
                    </ul>
                    <button class="show-answer-btn" id="btn-${q.id}" onclick="toggleAnswer(${q.id})">
                        ${revealedAnswers[q.id] ? "🔒 Hide Answer & Explanation" : "🔓 Show Answer & Explanation"}
                    </button>
                    <div class="answer-reveal ${revealedAnswers[q.id] ? "show" : ""}" id="answer-${q.id}">
                        <span class="ans-label">✅ Correct Answer: ${String.fromCharCode(65 + q.answer)}. ${q.options[q.answer]}</span>
                        <span class="explain-label">📝 Explanation:</span>
                        <span class="explain-text">${q.explain}</span>
                    </div>
                `;
          questionsContainer.appendChild(card);
        });

        // Attach option click handlers
        document
          .querySelectorAll(".options li:not(.disabled)")
          .forEach((li) => {
            li.addEventListener("click", function () {
              const qid = parseInt(this.dataset.qid);
              const opt = parseInt(this.dataset.opt);
              handleAnswer(qid, opt);
            });
          });

        updateStats();
      }

      function handleAnswer(qid, selectedOpt) {
        if (userAnswers[qid] !== undefined) return; // Already answered

        const q = allQuestions.find((q) => q.id === qid);
        userAnswers[qid] = selectedOpt;

        // Re-render just this card
        const card = document.getElementById("q-card-" + qid);
        const optionsList = document.getElementById("options-" + qid);

        // Update classes
        if (selectedOpt === q.answer) {
          card.classList.add("answered-correct");
        } else {
          card.classList.add("answered-wrong");
        }

        // Update options
        const items = optionsList.querySelectorAll("li");
        items.forEach((li, idx) => {
          li.classList.add("disabled");
          if (idx === selectedOpt) li.classList.add("selected");
          if (idx === q.answer) li.classList.add("correct-choice");
          if (idx === selectedOpt && idx !== q.answer)
            li.classList.add("wrong-choice");
          // Update icon
          const icon = li.querySelector(".icon-feedback");
          if (idx === q.answer) icon.textContent = "✅";
          if (idx === selectedOpt && idx !== q.answer) icon.textContent = "❌";
          icon.style.display =
            idx === q.answer || (idx === selectedOpt && idx !== q.answer)
              ? "inline"
              : "none";
        });

        updateStats();
      }

      function toggleAnswer(qid) {
        revealedAnswers[qid] = !revealedAnswers[qid];
        const answerDiv = document.getElementById("answer-" + qid);
        const btn = document.getElementById("btn-" + qid);

        if (revealedAnswers[qid]) {
          answerDiv.classList.add("show");
          btn.textContent = "🔒 Hide Answer & Explanation";
        } else {
          answerDiv.classList.remove("show");
          btn.textContent = "🔓 Show Answer & Explanation";
        }
      }

      function updateStats() {
        const total = allQuestions.length;
        const answered = Object.keys(userAnswers).length;
        let correct = 0;
        let wrong = 0;

        for (const [qid, selected] of Object.entries(userAnswers)) {
          const q = allQuestions.find((q) => q.id === parseInt(qid));
          if (q && selected === q.answer) correct++;
          else wrong++;
        }

        const remain = total - answered;
        const pct = answered > 0 ? Math.round((correct / answered) * 100) : 0;

        correctCountEl.textContent = correct;
        wrongCountEl.textContent = wrong;
        remainCountEl.textContent = remain;
        scorePctEl.textContent = pct + "%";
        progressFill.style.width = (answered / total) * 100 + "%";
      }

      function resetAll() {
        if (
          confirm(
            "Are you sure you want to reset all answers? This cannot be undone.",
          )
        ) {
          userAnswers = {};
          revealedAnswers = {};
          const activeBtn = document.querySelector(
            ".topic-filter button.active",
          );
          const activeTopic = activeBtn ? activeBtn.dataset.topic : "all";
          renderQuestions(activeTopic);
          updateStats();
        }
      }

      // Initialize
      renderTopicFilter();
      renderQuestions("all");
      updateStats();
    </script>
  </body>
</html>
